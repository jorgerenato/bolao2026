<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOLÃO COPA 2026</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;500;700&display=swap"
        rel="stylesheet">
    <script>
        window.APP_VERSION = '11';
    </script>
    <link rel="stylesheet" href="styles.css?v=11">
</head>

<body>
    <div class="bg-pattern"></div>

    <header class="header">
        <div class="header-content">
            <!--<a href="wrapped.html" class="stats-link">🎁 Retrospectiva (Wrapped)</a>-->
            <div class="badge">⚽ 6 JOGADORES</div>
            <h1 class="main-title">BOLÃO<br><span class="highlight">COPA 2026</span></h1>
            <p class="subtitle">Quem faz o melhor palpite?</p>
        </div>
    </header>

    <main class="container">
        <!-- Classificação -->
        <section class="leaderboard-section">
            <div class="section-header">
                <h2 class="section-title">CLASSIFICAÇÃO</h2>
                <div class="trophy">🏆</div>
            </div>
            <div class="podium" id="podium">
                <!-- Populated by JS -->
            </div>
        </section>

        <!-- Estatísticas Gerais -->
        <section class="stats-overview-section">
            <h2 class="section-title">ESTATÍSTICAS GERAIS <span class="jogos-count" id="jogos-count"></span></h2>
            <div class="stats-overview-grid" id="stats-overview">
                <!-- Populated by JS -->
            </div>
        </section>

        <!-- Jogos -->
        <section class="matches-section">
            <h2 class="section-title">JOGOS & PALPITES</h2>
            <div class="filter-buttons">
                <button class="filter-btn active" data-filter="hoje">📅 Hoje</button>
                <button class="filter-btn" data-filter="proximos">🔜 Próximos</button>
                <button class="filter-btn" data-filter="anteriores">✅ Jogados</button>
                <button class="filter-btn" data-filter="todos">📋 Todos</button>
            </div>
            <div class="matches-list" id="matches-list">
                <!-- Populated by JS -->
            </div>
        </section>

        <!-- Legenda -->
        <section class="legend-section">
            <h3>PONTUAÇÃO</h3>
            <div class="legend-items">
                <div class="legend-item">
                    <span class="legend-badge badge-exact">3</span>
                    <span>Placar exato</span>
                </div>
                <div class="legend-item">
                    <span class="legend-badge badge-winner">1</span>
                    <span>Acertou vencedor/empate</span>
                </div>
                <div class="legend-item">
                    <span class="legend-badge badge-zero">0</span>
                    <span>Errou tudo</span>
                </div>
            </div>
        </section>
    </main>

    <footer class="footer">
        <p>Bolão Copa 2026 — Feito com ⚽</p>
        <p class="last-update" id="last-update">Atualizado: carregando...</p>
    </footer>

    <script src="core.js?v=11"></script>
    <script src="script.js?v=11"></script>
</body>

</html>
